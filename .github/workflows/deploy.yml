# main 브랜치에 올리면 자동으로 사이트를 만들어 GitHub Pages에 배포합니다.
# GitHub Actions: GitHub이 대신 실행해 주는 자동 작업 설정 파일입니다.
# 아래 순서: ① 코드 받기 → ② 사이트 만들기(build) → ③ GitHub Pages에 올리기(deploy)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions 화면에서 직접 '다시 실행'도 할 수 있게 함

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # ① 저장소의 코드를 내려받기
      - uses: withastro/action@v3      # ② Astro로 사이트 만들기
        env:
          # 정식 공개: 'false' 면 검색엔진 수집을 허용합니다. ('true' 로 바꾸면 다시 검색 차단)
          PUBLIC_STAGING: 'false'
          # 사이트 주소. canonical·사이트맵·공유 미리보기 주소가 모두 이 값을 기준으로 만들어집니다.
          SITE_URL: 'https://neuvelif.com'
          # 주소 뒤에 붙는 폴더. 자체 도메인에서는 맨 앞(/)이므로 '/' 입니다.
          BASE_PATH: '/'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4  # ③ 만든 사이트를 인터넷에 올리기
  # ④ 배포가 끝나면 빙·네이버 등에 "페이지가 바뀌었어요"라고 알리기 (IndexNow)
  #    실패해도 사이트 배포에는 영향이 없습니다.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KEY: 4ec3edc866360f185362d3554db47f4a
    steps:
      - run: |
          sleep 30
          urls=$(curl -fsS https://neuvelif.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          body="{\"host\":\"neuvelif.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://neuvelif.com/$KEY.txt\",\"urlList\":$urls}"
          for api in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            curl -sS -o /dev/null -w "$api %{http_code}\n" -X POST "$api" -H 'Content-Type: application/json; charset=utf-8' -d "$body" || true
          done
